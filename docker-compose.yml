services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3001:3000" 
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5174:5173" 
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data: