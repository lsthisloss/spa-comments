# Ограничение памяти - 60% от доступной (примерно 600MB при 1GB лимите)
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.5

# Диск для временного хранения при нехватке памяти
disk_free_limit.relative = 2.0

# Ограничения по умолчанию для всех очередей
default_vhost_limits.max_queues = 10
default_vhost_limits.max_exchanges = 20
default_vhost_limits.max_connections = 50

# Настройки heartbeat
heartbeat = 60
frame_max = 131072

# Логирование
log.console = true
log.console.level = warning