version: '3.8'

services:
  postgres-dev:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-spa_comments}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-spa_comments}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    
  elasticsearch-dev:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch-dev
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - bootstrap.memory_lock=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s || exit 1"]
      interval: 30s
      timeout: 120s
      retries: 10
      start_period: 360s
    restart: unless-stopped

  rabbitmq-dev:
    image: rabbitmq:3-management
    container_name: rabbitmq-dev
    hostname: rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_ERLANG_COOKIE: dev_cookie_123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  backend-dev:
    build:
      context: ./backend
      target: development
    container_name: backend-dev
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres-dev:
        condition: service_healthy
      rabbitmq-dev:
        condition: service_healthy
      elasticsearch-dev:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DB_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      
      RABBITMQ_QUEUE_MAX_LENGTH: ${RABBITMQ_QUEUE_MAX_LENGTH}
      RABBITMQ_QUEUE_MAX_BYTES: ${RABBITMQ_QUEUE_MAX_BYTES}
      RABBITMQ_MESSAGE_TTL: ${RABBITMQ_MESSAGE_TTL}
      
      JWT_SECRET: ${JWT_SECRET}
      NODE_OPTIONS: ${NODE_OPTIONS}
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: debug
      FORCE_UPDATE: ${FORCE_UPDATE}
    command: npm run dev
    restart: unless-stopped

  frontend-dev:
    build:
      context: ./frontend
      target: development
    container_name: frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL}
      NODE_OPTIONS: "--max-old-space-size=4096"
      NODE_ENV: development
    restart: unless-stopped

volumes:
  elasticsearch_data:
    name: spa-comments_elasticsearch_data
  postgres_data:
    name: spa_comments_postgres_data_dev
  rabbitmq_data:
    name: spa-comments_rabbitmq_data